<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LYS MEDICAL — Aperçu ordonnance</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root{
  --navy:#0A1628;--navy-light:#1E3150;--gold:#C8A96E;--gold-pale:#F5EDD9;
  --white:#FAFAF8;--bg:#F2F0EA;--surface:#FFFFFF;--text:#2C3A4A;--muted:#8A9BB5;
  --green:#3DAA70;--green-bg:#EAF7F0;--red:#E05050;--sidebar-w:260px;
}
html,body{height:100%;font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);}
.app{display:flex;height:100vh;overflow:hidden;}
.sidebar{width:var(--sidebar-w);min-width:var(--sidebar-w);background:var(--navy);display:flex;flex-direction:column;overflow:hidden;}
.sb-logo{display:flex;align-items:center;gap:12px;padding:28px 24px 24px;border-bottom:1px solid rgba(200,169,110,0.1);}
.sb-logo-icon{width:34px;height:34px;background:rgba(200,169,110,0.12);border-radius:9px;display:flex;align-items:center;justify-content:center;}
.sb-logo-name{font-family:'Cormorant Garamond',serif;font-size:15px;font-weight:600;color:var(--white);letter-spacing:2px;text-transform:uppercase;}
.sb-logo-sub{font-size:9.5px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;}
.sb-section-label{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:rgba(138,155,181,0.5);padding:16px 24px 8px;}
.sb-nav{display:flex;flex-direction:column;gap:2px;padding:0 12px;}
.nav-item{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:10px;cursor:pointer;transition:all 0.2s;color:var(--muted);font-size:13.5px;text-decoration:none;position:relative;}
.nav-item svg{width:16px;height:16px;flex-shrink:0;opacity:0.7;}
.nav-item:hover{background:rgba(255,255,255,0.05);color:var(--white);}
.nav-item.active{background:rgba(200,169,110,0.12);color:var(--gold-pale);}
.nav-item.active svg{opacity:1;color:var(--gold);}
.nav-item.active::before{content:'';position:absolute;left:0;top:25%;bottom:25%;width:3px;border-radius:0 3px 3px 0;background:var(--gold);}
.sb-bottom{margin-top:auto;padding:16px 12px 24px;}
.sb-user{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:10px;background:rgba(255,255,255,0.05);}
.avatar{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;background:rgba(200,169,110,0.2);color:var(--gold-pale);}
.sb-user-name{font-size:13px;font-weight:500;color:var(--white);}
.sb-user-role{font-size:11px;color:var(--muted);}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.topbar{background:var(--surface);border-bottom:1px solid rgba(0,0,0,0.06);padding:0 28px;height:64px;display:flex;align-items:center;gap:14px;flex-shrink:0;}
.tb-back{height:36px;padding:0 14px;border-radius:8px;border:1.5px solid #E8E6E0;background:transparent;color:var(--muted);font-size:12.5px;font-family:'DM Sans',sans-serif;text-decoration:none;display:flex;align-items:center;gap:8px;}
.tb-back:hover{border-color:var(--navy);color:var(--navy);}
.topbar-title{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:500;color:var(--navy);flex:1;}
.topbar-title em{font-style:italic;color:var(--gold);}
.tb-btn{height:36px;padding:0 16px;border-radius:8px;font-size:12.5px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;display:flex;align-items:center;gap:7px;transition:all 0.2s;border:none;background:var(--navy);color:var(--white);}
.tb-btn:hover{background:var(--navy-light);}
.preview-pane{flex:1;background:#E8E4DC;overflow-y:auto;display:flex;flex-direction:column;align-items:center;padding:32px 24px;}
.preview-label{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#9A9490;font-weight:500;margin-bottom:16px;display:flex;align-items:center;gap:8px;}
.rx-doc{width:100%;max-width:560px;background:var(--white);border-radius:4px;box-shadow:0 8px 40px rgba(0,0,0,0.15),0 2px 8px rgba(0,0,0,0.08);overflow:hidden;position:relative;}
.rx-doc::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--navy),var(--gold),var(--navy));}
.rx-watermark{position:absolute;bottom:60px;right:32px;font-family:'Cormorant Garamond',serif;font-size:80px;font-weight:600;color:rgba(10,22,40,0.04);transform:rotate(-20deg);pointer-events:none;line-height:1;letter-spacing:-2px;text-transform:uppercase;}
.rx-head{padding:28px 32px 20px;display:flex;align-items:flex-start;justify-content:space-between;border-bottom:1px solid #ECEAE4;}
.rx-cabinet-name{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:600;color:var(--navy);letter-spacing:1px;text-transform:uppercase;margin-bottom:4px;}
.rx-cabinet-sub{font-size:10.5px;color:var(--muted);font-weight:300;line-height:1.6;}
.rx-qr{width:52px;height:52px;background:var(--bg);border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0;border:1px solid rgba(0,0,0,0.07);}
.rx-qr svg{width:36px;height:36px;opacity:0.4;}
.rx-meta{padding:12px 32px;background:var(--bg);display:flex;align-items:center;gap:24px;border-bottom:1px solid #ECEAE4;flex-wrap:wrap;}
.rx-meta-item{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--muted);}
.rx-meta-item strong{color:var(--navy);font-weight:500;}
.rx-body{padding:24px 32px;}
.rx-pat-block{padding:14px 16px;border-radius:8px;background:rgba(10,22,40,0.03);border:1px solid rgba(10,22,40,0.07);margin-bottom:22px;}
.rx-pat-label{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);font-weight:500;margin-bottom:6px;}
.rx-pat-name{font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:500;color:var(--navy);margin-bottom:3px;}
.rx-pat-info{font-size:11.5px;color:var(--muted);font-weight:300;display:flex;gap:16px;flex-wrap:wrap;}
.rx-symbol{font-family:'Cormorant Garamond',serif;font-size:32px;font-weight:600;color:var(--navy);opacity:0.15;margin-bottom:12px;line-height:1;}
.rx-drug-entry{margin-bottom:18px;padding-bottom:18px;border-bottom:1px dashed #ECEAE4;}
.rx-drug-entry:last-child{border-bottom:none;margin-bottom:0;}
.rx-d-num{display:inline-block;width:20px;height:20px;background:var(--navy);color:var(--white);border-radius:4px;text-align:center;line-height:20px;font-size:11px;font-weight:500;margin-right:8px;flex-shrink:0;}
.rx-d-name{font-size:15px;font-weight:500;color:var(--navy);margin-bottom:5px;display:flex;align-items:center;}
.rx-d-posologie{font-size:13px;color:var(--text);font-weight:300;margin-left:28px;line-height:1.6;}
.rx-d-note{font-size:12px;color:var(--muted);font-style:italic;margin-left:28px;margin-top:3px;}
.rx-foot{padding:20px 32px 24px;border-top:1px solid #ECEAE4;display:flex;align-items:flex-end;justify-content:space-between;}
.rx-foot-info{font-size:11px;color:var(--muted);font-weight:300;line-height:1.7;}
.rx-foot-info strong{color:var(--navy);font-weight:500;display:block;font-size:12px;}
.rx-signature{text-align:right;}
.rx-sig-label{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:28px;}
.rx-sig-line{width:120px;border-top:1px solid var(--navy);margin-left:auto;}
.rx-sig-name{font-size:11px;color:var(--navy);font-weight:500;text-align:right;margin-top:4px;}
.rx-num{font-size:10px;color:#C0BBAF;margin-top:10px;letter-spacing:0.5px;}
#toast{position:fixed;bottom:24px;right:24px;background:var(--navy);color:var(--white);padding:12px 18px;border-radius:10px;font-size:13px;z-index:999;opacity:0;transform:translateY(16px);transition:all 0.3s;pointer-events:none;border-left:3px solid var(--gold);}
#toast.error{border-left-color:var(--red);}
@media print{
  body{overflow:visible;background:white;}
  .app{display:block;height:auto;}
  .sidebar,.topbar,.preview-label{display:none !important;}
  .preview-pane{background:white;padding:0;display:block;}
  .rx-doc{max-width:100%;box-shadow:none;border-radius:0;}
  .rx-watermark{display:none;}
}
@media(max-width:740px){.sidebar{display:none;}.topbar{padding:0 14px;}.preview-pane{padding:18px 12px;}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="sb-logo">
      <div class="sb-logo-icon"><svg viewBox="0 0 24 24" fill="none"><path d="M12 4v16M4 12h16" stroke="#C8A96E" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="12" r="9" stroke="#C8A96E" stroke-width="1.5" opacity="0.4"/></svg></div>
      <div><div class="sb-logo-name">Lys Medical</div><div class="sb-logo-sub">Portail de gestion</div></div>
    </div>
    <div class="sb-section-label">Menu médecin</div>
    <nav class="sb-nav">
      <a href="dashboard-medecin.html" class="nav-item">Tableau de bord</a>
      <a href="patients-medecin.html" class="nav-item">Mes patients</a>
      <a href="rdv-medecin.html" class="nav-item">Mes rendez-vous</a>
      <a href="ordonnances-medecin.html" class="nav-item active">Ordonnances</a>
      <a href="lys-medical-historique.html" class="nav-item">Historique</a>
    </nav>
    <div class="sb-bottom">
      <div class="sb-user">
        <div class="avatar">DR</div>
        <div><div class="sb-user-name">Médecin</div><div class="sb-user-role">Espace médecin</div></div>
      </div>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <a href="ordonnances-medecin.html" class="tb-back">Retour</a>
      <div class="topbar-title">Aperçu <em>ordonnance</em></div>
      <button class="tb-btn" onclick="window.print()">Imprimer</button>
    </div>
    <div class="preview-pane">
      <div class="preview-label">Aperçu imprimable</div>
      <div class="rx-doc" id="rxDoc"></div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const params = new URLSearchParams(window.location.search);
const id = params.get('id') || params.get('idOrdonnance');

function escapeHtml(value) {
  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

function formatDate(value) {
  if (!value) return '—';
  const date = new Date(`${value}T00:00:00`);
  if (Number.isNaN(date.getTime())) return value;
  return date.toLocaleDateString('fr-FR', {day:'2-digit', month:'long', year:'numeric'});
}

function patientName(patient) {
  return [patient?.prenom, patient?.nom].filter(Boolean).join(' ').trim() || 'Patient';
}

function medecinName(medecin) {
  const name = [medecin?.prenom, medecin?.nom].filter(Boolean).join(' ').trim();
  return name ? `Dr. ${name}` : 'Médecin';
}

function renderOrdonnance(data) {
  if (!data || !data.success) {
    const message = data?.message || 'Ordonnance introuvable.';
    showToast(message, 'error');
    document.getElementById('rxDoc').innerHTML = `<div style="padding:40px;text-align:center;color:var(--muted);">${escapeHtml(message)}</div>`;
    return;
  }

  const ordonnance = data.ordonnance || {};
  const patient = data.patient || {};
  const medecin = data.medecin || {};
  const medicaments = Array.isArray(data.medicaments) ? data.medicaments : [];
  const numero = ordonnance.numeroOrdonnance || `ORD-${ordonnance.idOrdonnance || ''}`;
  const dateLabel = formatDate(ordonnance.date);
  const type = ordonnance.typeOrdonnance || 'Ordonnance';
  const doctorName = medecinName(medecin);
  const doctorSpecialite = medecin.specialite || 'Médecin';

  const drugsHTML = medicaments.length ? medicaments.map((m, index) => {
    const posologie = [m.posologie, m.frequence, m.duree].filter(Boolean).join(' — ');
    return `
      <div class="rx-drug-entry">
        <div class="rx-d-name"><span class="rx-d-num">${index + 1}</span>${escapeHtml(m.nom || 'Médicament')}</div>
        <div class="rx-d-posologie">${escapeHtml(posologie || '—')}</div>
        ${m.note ? `<div class="rx-d-note">${escapeHtml(m.note)}</div>` : ''}
      </div>
    `;
  }).join('') : '<div style="color:var(--muted);font-size:13px;">Aucun médicament</div>';

  document.getElementById('rxDoc').innerHTML = `
    <div class="rx-watermark">Rx</div>
    <div class="rx-head">
      <div>
        <div class="rx-cabinet-name">Lys Medical</div>
        <div class="rx-cabinet-sub">
          Cabinet médical · 12 Rue Krim Belkacem, Oran 31000<br>
          Tél : +213 (0) 41 XX XX XX · contact@lysmedical.dz<br>
          ${escapeHtml(type)}
        </div>
      </div>
      <div class="rx-qr">
        <svg viewBox="0 0 36 36" fill="none">
          <rect x="2" y="2" width="14" height="14" rx="1" stroke="currentColor" stroke-width="2"/>
          <rect x="20" y="2" width="14" height="14" rx="1" stroke="currentColor" stroke-width="2"/>
          <rect x="2" y="20" width="14" height="14" rx="1" stroke="currentColor" stroke-width="2"/>
          <rect x="20" y="20" width="4" height="4" fill="currentColor" opacity="0.5"/>
          <rect x="26" y="26" width="4" height="4" fill="currentColor" opacity="0.5"/>
        </svg>
      </div>
    </div>
    <div class="rx-meta">
      <div class="rx-meta-item">Le <strong>${escapeHtml(dateLabel)}</strong></div>
      <div class="rx-meta-item">N° <strong>${escapeHtml(numero)}</strong></div>
      <div class="rx-meta-item">Statut <strong>${escapeHtml(ordonnance.statut || '—')}</strong></div>
    </div>
    <div class="rx-body">
      <div class="rx-pat-block">
        <div class="rx-pat-label">Patient</div>
        <div class="rx-pat-name">${escapeHtml(patientName(patient))}</div>
        <div class="rx-pat-info">
          <span>N° #PT-${escapeHtml(patient.idPatient || '—')}</span>
          ${patient.telephone ? `<span>${escapeHtml(patient.telephone)}</span>` : ''}
          ${patient.sexe ? `<span>${escapeHtml(patient.sexe)}</span>` : ''}
        </div>
      </div>
      <div class="rx-symbol">℞</div>
      ${drugsHTML}
    </div>
    <div class="rx-foot">
      <div class="rx-foot-info">
        <strong>${escapeHtml(doctorName)}</strong>
        ${escapeHtml(doctorSpecialite)}<br>
        ${escapeHtml(medecin.telephone || '+213 (0) 41 XX XX XX')}
        <div class="rx-num">N° ordonnance : ${escapeHtml(numero)}</div>
      </div>
      <div class="rx-signature">
        <div class="rx-sig-label">Signature &amp; cachet</div>
        <div class="rx-sig-line"></div>
        <div class="rx-sig-name">${escapeHtml(doctorName)}</div>
      </div>
    </div>
  `;

  if (params.get('print') === '1') {
    setTimeout(() => window.print(), 300);
  }
}

function showToast(msg, type='info') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = type === 'error' ? 'error' : '';
  t.style.opacity = '1';
  t.style.transform = 'translateY(0)';
  clearTimeout(t._t);
  t._t = setTimeout(() => {
    t.style.opacity = '0';
    t.style.transform = 'translateY(16px)';
  }, 2600);
}

const ALLOWED_ROLES = ['medecin', 'patient', 'admin'];
const ROLE_REDIRECTS = {
  admin: 'admin.html',
  secretaire: 'dashboard-secretaire.html',
  medecin: 'dashboard-medecin.html',
  patient: 'dashboard-patient.html'
};

async function checkSession(){
  try{
    const res = await fetch('backend/check_session.php', { credentials:'same-origin' });
    const data = await res.json();

    if(!res.ok || !data.logged || !data.user){
      window.location.href = 'login.html';
      return false;
    }

    const role = String(data.user.role || '').toLowerCase();
    if(!ALLOWED_ROLES.includes(role)){
      window.location.href = ROLE_REDIRECTS[role] || 'login.html';
      return false;
    }

    return true;
  }catch(e){
    window.location.href = 'login.html';
    return false;
  }
}

async function initPage(){
  const canLoad = await checkSession();
  if(!canLoad) return;

  if (!id || !/^\d+$/.test(String(id))) {
    renderOrdonnance({success:false, message:'Identifiant ordonnance manquant.'});
    return;
  }

  const url = `backend/ordonnance/get_one.php?id=${encodeURIComponent(id)}`;
  try {
    const res = await fetch(url, {credentials:'same-origin'});
    let data;
    try {
      data = await res.json();
    } catch (e) {
      renderOrdonnance({success:false, message:'Erreur serveur.'});
      return;
    }

    if (!res.ok || !data.success) {
      const message = res.status === 403
        ? 'Accès non autorisé.'
        : (res.status === 404 ? 'Ordonnance introuvable.' : (data.message || 'Erreur serveur.'));
      renderOrdonnance({success:false, message});
      return;
    }

    renderOrdonnance(data);
  } catch (e) {
    renderOrdonnance({success:false, message:'Erreur serveur.'});
  }
}

document.addEventListener('DOMContentLoaded', initPage);
</script>
</body>
</html>
